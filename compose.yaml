services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: osr
      POSTGRES_USER: osr
      POSTGRES_PASSWORD: ${OSR_DB_PASSWORD:?set OSR_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - osr-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osr -d osr"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  osr-postgres:
